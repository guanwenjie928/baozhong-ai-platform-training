# ════════════════════════════════════════════════════════════
#  nginx 配置模板 — 两种模式
# ════════════════════════════════════════════════════════════
#
# 📌 实际部署时由 deploy.sh 自动生成配置，存放于：
#    /etc/nginx/conf.d/{{APP_NAME}}.conf（按应用名独立命名）
#    避免多应用共用 default.conf 导致互相覆盖。
#
# 替换占位符:
#   {{NGINX_PORT}}   - nginx 监听端口（通常 8080）
#   {{BASE_PATH}}    - 应用路径前缀（如 /yourapp/）
#   {{SERVER_PORT}}  - 后端服务端口（由 deploy.sh 自动分配首个空闲端口）
#   {{OTHER_PORT}}   - 共存应用的端口（如 5000）
#
# 端口分配策略:
#   deploy.sh 优先查找空闲端口，不主动 kill 任何已占用端口的进程。
#   如果期望端口被占用，自动递增扫描到第一个可用端口。
# ════════════════════════════════════════════════════════════


# ─── 模式 A: 路径隔离（多应用共存）─────────────────────────
# 场景: 同一个域名下运行多个 Web 应用，通过 URL 路径前缀分流
# 示例: / → 应用A(5000), /zhique/ → 知雀(9000), /admin/ → 后台(9001)
#
# 数据流: 用户请求 → nginx(8080) 按路径分发 → 对应后端端口

server {
    listen {{NGINX_PORT}};
    server_name _;
    charset utf-8;
    absolute_redirect off;

    # ── 应用 A（路径前缀分流）──
    location {{BASE_PATH}} {
        proxy_pass http://127.0.0.1:{{SERVER_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 其他应用（根路径兜底）──
    location / {
        proxy_pass http://127.0.0.1:{{OTHER_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# ─── 模式 B: 独占根路径（仅一个应用）───────────────────────
# 场景: 该服务是唯一应用，或者整台机器只跑这一个服务
# 示例: / → 唯一应用（由 deploy.sh 自动分配的空闲端口）

server {
    listen {{NGINX_PORT}};
    server_name _;
    charset utf-8;
    absolute_redirect off;

    location / {
        proxy_pass http://127.0.0.1:{{SERVER_PORT}};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}


# ─── 常见问题排查 ─────────────────────────────────────────
#
# Q: 前端页面 404 但 API 正常？
# A: 检查 vite base 是否设置正确。vite.config.ts 中 base 必须与 nginx location 路径一致。
#
# Q: API 返回 HTML 而非 JSON？
# A: 前端 api.ts 中的 BASE 常量没更新。路径隔离模式下必须以 /yourapp/api 开头。
#
# Q: 远程浏览器访问 502？
# A: 检查后端服务是否在运行: curl http://127.0.0.1:{{SERVER_PORT}}/api/health
#
# Q: 远程浏览器添加了 UUID 前缀导致路由不匹配？
# A: server.py 中的 StripPathPrefixMiddleware 会自动剥离 UUID 前缀。
#
# Q: 端口冲突怎么办？
# A: deploy.sh 会自动查找空闲端口，无需手动干预。
#    如果端口 9000 被占用，自动尝试 9001、9002...直到找到可用端口。
#    不会 kill 任何已在运行的应用。
